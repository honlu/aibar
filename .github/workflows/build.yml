name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain and version
        shell: bash
        run: |
          swift --version
          test "$(uname -m)" = arm64
          version=0.1.1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          echo "AIBAR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build app and DMG
        run: bash scripts/build-app.sh
      - name: Verify package
        shell: bash
        run: |
          codesign --verify --strict dist/AIbar.app
          lipo dist/AIbar.app/Contents/MacOS/AIbar -verify_arch arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/AIbar.app/Contents/Info.plist)" = AIbar
          test -s dist/AIbar.app/Contents/Resources/AIbar.icns
          cd dist
          shasum -a 256 -c "AIbar-${AIBAR_VERSION}-arm64.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AIbar-arm64-DMG
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "AIbar $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
