name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain and version
        shell: bash
        run: |
          swift --version
          test "$(uname -m)" = '${{ matrix.arch }}'
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          echo "AIBAR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Package and verify
        shell: bash
        run: |
          codesign --verify --strict dist/AIbar.app
          lipo -verify_arch '${{ matrix.arch }}' dist/AIbar.app/Contents/MacOS/AIbar
          ditto -c -k --sequesterRsrc --keepParent dist/AIbar.app "dist/AIbar-${AIBAR_VERSION}-${{ matrix.arch }}.zip"
          cd dist
          shasum -a 256 "AIbar-${AIBAR_VERSION}-${{ matrix.arch }}.zip" > "AIbar-${AIBAR_VERSION}-${{ matrix.arch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: AIbar-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "AIbar $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
